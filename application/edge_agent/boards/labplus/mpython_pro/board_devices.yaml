version: 1.0.0
# Devices for the Labplus mPython Pro (掌控板 3.0).
devices:
  # Onboard 1.47" 320x172 ST7789 over SPI (CS=34, DC/RS=35, no reset line).
  # The glass is natively portrait 172x320, so swap_xy is used to expose the
  # documented 320x172 landscape geometry.
  #
  # Orientation was determined empirically on real hardware, because the mapping
  # of the MADCTL bits is not intuitive once swap_xy is in play: with MV set, the
  # MX bit flips the image VERTICALLY and MY flips it HORIZONTALLY, the opposite
  # of what the parameter names suggest. Presenting the panel as 320x172 landscape
  # needs:
  #   swap_xy  -> MV, transposes the 172x320 glass into landscape
  #   mirror_x -> MX, leaves the vertical axis alone
  #   mirror_y -> MY, must stay 0 or the output comes out left-right mirrored,
  #               which no rotation of the device can undo
  # MX|MY|MV and MX|MV both render mirrored or upside down respectively; only
  # MX|MV (this setting) is upright.
  #
  # The 34-pixel offset centres the 172-pixel glass in the ST7789 240x320 frame
  # memory. The board manager has no gap field, so setup_device.c applies it.
  - name: display_lcd
    chip: st7789
    type: display_lcd
    sub_type: spi
    version: default
    config:
      mirror_x: true
      mirror_y: false
      swap_xy: true
      invert_color: true
      x_max: 320
      y_max: 172
      io_spi_config:
        cs_gpio_num: 34           # LCD CS
        dc_gpio_num: 35           # LCD RS / DC
        spi_mode: 0
        pclk_hz: 40000000
      lcd_panel_config:
        reset_gpio_num: -1        # The panel reset is tied to the board reset
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        vendor_config: NULL
    peripherals:
      - name: spi_display

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 80
    peripherals:
      - name: ledc_backlight

  # ES8388 DAC feeding the NS4150 class-D speaker amplifier.
  # 0x20 is the ES8388 8-bit I2C address (7-bit 0x10).
  - name: audio_dac
    chip: es8388
    type: audio_codec
    version: default
    config:
      adc_enabled: false
      dac_enabled: true
      dac_max_channel: 2
      dac_channel_mask: "11"
      mclk_enabled: true
    peripherals:
      - name: i2s_audio_out
      - name: i2c_master
        address: 0x20
        frequency: 400000

  # ES8388 ADC fed by the dual onboard microphones.
  - name: audio_adc
    chip: es8388
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      dac_enabled: false
      adc_max_channel: 2
      adc_channel_mask: "11"
      adc_init_gain: 0
      mclk_enabled: true
    peripherals:
      - name: i2s_audio_in
      - name: i2c_master
        address: 0x20
        frequency: 400000

  # Three onboard WS2812 LEDs on GPIO8, driven through the RMT peripheral.
  - name: led_strip
    chip: ws2812
    type: custom
    version: default
    init_skip: true
    dependencies:
      espressif/led_strip:
        version: "^3.0"
        public: true
    config:
      max_leds: 3
    peripherals:
      - name: rmt_tx

  # Physical button A (GPIO0 / pad P5).
  - name: button_a
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      long_press_time: 2000
      short_press_time: 100
      events_cfg:
        press_down: true
        press_up: true
        single_click: true
        double_click: true
        multi_click: false
        long_press_start: true
        long_press_up: true
        long_press_hold: false
        press_repeat: false
        press_repeat_done: false
        press_end: false
    peripherals:
      - name: gpio_button_a

  # Physical button B (GPIO46 / pad P11).
  - name: button_b
    type: button
    sub_type: gpio
    version: default
    config:
      active_level: 0
      long_press_time: 2000
      short_press_time: 100
      events_cfg:
        press_down: true
        press_up: true
        single_click: true
        double_click: true
        multi_click: false
        long_press_start: true
        long_press_up: true
        long_press_hold: false
        press_repeat: false
        press_repeat_done: false
        press_end: false
    peripherals:
      - name: gpio_button_b
